<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embedded youtube video</title>
    <!-- <link href="style.css" rel="stylesheet"/> -->

    <style>
      .video-wrapper {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
      }
      .video-wrapper iframe {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Learn HTML Basics</h1>
    </header>

    <main>
      <div>
        <p>
          Watch this beginner-friendly video tutorial to get started with
          Nestjs.
        </p>
      </div>

      <div class="video-wrapper">
        <iframe
          width="868"
          height="488"
          src="https://www.youtube.com/embed/RwOxUg2rsjY"
          title="كورس Nest JS في ٣ ساعات | Type ORM - MySql DB - Modules - Dependency Injection"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        >
        </iframe>
      </div>

      <!-- <div>
            <select id="test" name="test">
                <option value="" disabled>Select an option</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div> -->
    </main>

    <footer></footer>
  </body>
</html>
